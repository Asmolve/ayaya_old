name: CI

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  scan_ruby:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Scan for common Rails security vulnerabilities using static analysis
        run: bundle exec brakeman --no-pager

      - name: Scan for known security vulnerabilities in gems used
        run: bin/bundler-audit

  lint:
    runs-on: ubuntu-latest
    env:
      RUBOCOP_CACHE_ROOT: tmp/rubocop
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Prepare RuboCop cache
        uses: actions/cache@v4
        env:
          DEPENDENCIES_HASH: ${{ hashFiles('.ruby-version', '**/.rubocop.yml', '**/.rubocop_todo.yml', 'Gemfile.lock') }}
        with:
          path: ${{ env.RUBOCOP_CACHE_ROOT }}
          key: rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-${{ github.ref_name == github.event.repository.default_branch && github.run_id || 'default' }}
          restore-keys: |
            rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-

      - name: Lint code for consistent style
        run: bin/rubocop -f github

  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: --health-cmd="pg_isready" --health-interval=10s --health-timeout=5s --health-retries=3

      # redis:
      #   image: valkey/valkey:8
      #   ports:
      #     - 6379:6379
      #   options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - name: Install packages
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libpq-dev

      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Run tests
        env:
          RAILS_ENV: test
          DATABASE_URL: postgres://postgres:postgres@localhost:5432
          TELEGRAM_TRUSTED_IDENTITY_SECRET: telegram-ci-trusted-identity-secret
          # RAILS_MASTER_KEY: ${{ secrets.RAILS_MASTER_KEY }}
          # REDIS_URL: redis://localhost:6379/0
        run: bin/rails db:test:prepare test

  telegram_app_test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: modules/telegram/app

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: --health-cmd="pg_isready" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - name: Install PostgreSQL development headers
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libpq-dev

      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Telegram app Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
          working-directory: modules/telegram/app

      - name: Check Telegram app autoloading
        env:
          RAILS_ENV: test
        run: bin/rails zeitwerk:check

      - name: Scan Telegram app for security vulnerabilities
        run: bin/brakeman --no-pager

      - name: Run Telegram app tests
        env:
          RAILS_ENV: test
          DATABASE_HOST: 127.0.0.1
          DATABASE_PORT: 5432
          DATABASE_USERNAME: postgres
          DATABASE_PASSWORD: postgres
          DATABASE_TEST_NAME: ayaya_mod_telegram_test
        run: bin/rails db:prepare && bin/rails test

  telegram_adapter_test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: modules/telegram/adapter

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: modules/telegram/adapter/requirements-test.txt

      - name: Install adapter test dependencies
        run: python -m pip install -r requirements-test.txt

      - name: Run Telegram adapter tests
        run: python -m pytest -q

  telegram_fault_test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: modules/telegram/adapter

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: modules/telegram/adapter/requirements-test.txt

      - name: Install adapter test dependencies
        run: python -m pip install -r requirements-test.txt

      - name: Run Telegram fault tests
        run: python -m pytest -q tests/test_health_status.py

  telegram_release_contract:
    runs-on: ubuntu-latest
    env:
      TELEGRAM_ENVELOPE_KEY_FILE: ${{ github.workspace }}/tmp/telegram-envelope-keyring.json

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Create CI Telegram envelope keyring
        run: |
          mkdir -p tmp
          printf '%s\n' '{"current_key_id":"ci-v1","keys":{"ci-v1":"MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIzNDU2Nzg5MDE="}}' > "$TELEGRAM_ENVELOPE_KEY_FILE"

      - name: Lint GitHub Actions workflow
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.7

      - name: Validate Nginx configuration
        run: docker run --rm -v "$PWD/deploy/nginx/ayaya.example.conf:/etc/nginx/nginx.conf:ro" nginx:1.27-alpine nginx -t

      - name: Validate Compose release configuration
        run: docker compose --env-file .env.example config --quiet

      - name: Build Telegram Adapter default test stage
        run: |
          docker build --tag ayaya-telegram-adapter-test --file modules/telegram/adapter/Dockerfile modules/telegram
          docker run --rm ayaya-telegram-adapter-test

      - name: Build Telegram Compose services
        run: docker compose --env-file .env.example build telegram_app telegram_migrate telegram_worker telegram_adapter

      - name: Provision and health-check Telegram Compose services
        run: docker compose --env-file .env.example up --detach --wait --wait-timeout 180 telegram_app telegram_worker telegram_adapter

      - name: Tear down Telegram Compose services
        if: always()
        run: docker compose --env-file .env.example down --volumes --remove-orphans

  system-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: --health-cmd="pg_isready" --health-interval=10s --health-timeout=5s --health-retries=3

      # redis:
      #   image: valkey/valkey:8
      #   ports:
      #     - 6379:6379
      #   options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - name: Install packages
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libpq-dev

      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Run System Tests
        env:
          RAILS_ENV: test
          DATABASE_URL: postgres://postgres:postgres@localhost:5432
          # RAILS_MASTER_KEY: ${{ secrets.RAILS_MASTER_KEY }}
          # REDIS_URL: redis://localhost:6379/0
        run: bin/rails db:test:prepare test:system

      - name: Keep screenshots from failed system tests
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: screenshots
          path: ${{ github.workspace }}/tmp/screenshots
          if-no-files-found: ignore
