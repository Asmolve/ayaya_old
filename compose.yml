name: ayaya

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${CORE_DATABASE_NAME:?Set CORE_DATABASE_NAME in .env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - postgres_data:/var/lib/postgresql/data

  core:
    build:
      context: .
      dockerfile: Dockerfile.dev
    environment:
      RAILS_ENV: ${RAILS_ENV:?Set RAILS_ENV in .env}
      DATABASE_HOST: ${DATABASE_HOST:?Set DATABASE_HOST in .env}
      DATABASE_PORT: ${DATABASE_PORT:?Set DATABASE_PORT in .env}
      DATABASE_USERNAME: ${DATABASE_USERNAME:?Set DATABASE_USERNAME in .env}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD in .env}
      DATABASE_NAME: ${CORE_DATABASE_NAME:?Set CORE_DATABASE_NAME in .env}
      RAILS_LOG_TO_STDOUT: ${RAILS_LOG_TO_STDOUT:?Set RAILS_LOG_TO_STDOUT in .env}
      AYAYA_ALLOWED_HOSTS: ${CORE_ALLOWED_HOSTS:?Set CORE_ALLOWED_HOSTS in .env}
      NOTES_ADAPTER_URL: ${NOTES_ADAPTER_URL:?Set NOTES_ADAPTER_URL in .env}
      NOTES_ADAPTER_SECRET: ${NOTES_ADAPTER_SECRET:?Set NOTES_ADAPTER_SECRET before starting Compose}
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      sh -lc "rm -f tmp/pids/server.pid &&
      bin/rails db:prepare &&
      bin/rails server -b 0.0.0.0 -p 3000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:3000/up >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 24
    ports:
      - "${CORE_HOST_PORT:?Set CORE_HOST_PORT in .env}:3000"
    volumes:
      - .:/rails
    stdin_open: true
    tty: true

  notes_app:
    build:
      context: ./modules/notes/app
      dockerfile: Dockerfile.dev
    environment:
      RAILS_ENV: ${RAILS_ENV:?Set RAILS_ENV in .env}
      DATABASE_HOST: ${DATABASE_HOST:?Set DATABASE_HOST in .env}
      DATABASE_PORT: ${DATABASE_PORT:?Set DATABASE_PORT in .env}
      DATABASE_USERNAME: ${DATABASE_USERNAME:?Set DATABASE_USERNAME in .env}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?Set DATABASE_PASSWORD in .env}
      DATABASE_NAME: ${NOTES_DATABASE_NAME:?Set NOTES_DATABASE_NAME in .env}
      RAILS_LOG_TO_STDOUT: ${RAILS_LOG_TO_STDOUT:?Set RAILS_LOG_TO_STDOUT in .env}
      AYAYA_ALLOWED_HOSTS: ${NOTES_ALLOWED_HOSTS:?Set NOTES_ALLOWED_HOSTS in .env}
      NOTES_INTERNAL_STATUS_SECRET: ${NOTES_INTERNAL_STATUS_SECRET:?Set NOTES_INTERNAL_STATUS_SECRET in .env}
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      sh -lc "rm -f tmp/pids/server.pid &&
      bin/rails server -b 0.0.0.0 -p 3000"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:3000/up >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 24
    volumes:
      - ./modules/notes/app:/rails
    stdin_open: true
    tty: true

  notes_adapter:
    build:
      context: ./modules/notes/adapter
    environment:
      NOTES_ADAPTER_SECRET: ${NOTES_ADAPTER_SECRET:?Set NOTES_ADAPTER_SECRET in .env}
      NOTES_INTERNAL_STATUS_SECRET: ${NOTES_INTERNAL_STATUS_SECRET:?Set NOTES_INTERNAL_STATUS_SECRET in .env}
      NOTES_APP_INTERNAL_STATUS_URL: ${NOTES_APP_INTERNAL_STATUS_URL:?Set NOTES_APP_INTERNAL_STATUS_URL in .env}
      NOTES_MODULE_YML: ${NOTES_MODULE_YML:?Set NOTES_MODULE_YML in .env}
    depends_on:
      notes_app:
        condition: service_healthy
    volumes:
      - ./modules/notes/module.yml:/module/module.yml:ro

  pic_obtainer_postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ayaya_mod_pic_obtainer
      POSTGRES_USER: pic_obtainer
      POSTGRES_PASSWORD: ${PIC_OBTAINER_POSTGRES_PASSWORD:?Set PIC_OBTAINER_POSTGRES_PASSWORD in .env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pic_obtainer -d ayaya_mod_pic_obtainer"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - pic_obtainer_postgres_data:/var/lib/postgresql/data

  pic_obtainer_migrate:
    image: ${PIC_OBTAINER_IMAGE:?Set PIC_OBTAINER_IMAGE in .env}
    command: ["alembic", "-x", "db_url=postgresql+psycopg://pic_obtainer:${PIC_OBTAINER_POSTGRES_PASSWORD:?Set PIC_OBTAINER_POSTGRES_PASSWORD in .env}@pic_obtainer_postgres:5432/ayaya_mod_pic_obtainer", "upgrade", "head"]
    depends_on:
      pic_obtainer_postgres:
        condition: service_healthy

  pic_obtainer_api:
    image: ${PIC_OBTAINER_IMAGE:?Set PIC_OBTAINER_IMAGE in .env}
    command: ["uvicorn", "pic_obtainer.api.main:create_app", "--factory", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      PIC_OBTAINER_DATABASE_URL: postgresql+psycopg://pic_obtainer:${PIC_OBTAINER_POSTGRES_PASSWORD:?Set PIC_OBTAINER_POSTGRES_PASSWORD in .env}@pic_obtainer_postgres:5432/ayaya_mod_pic_obtainer
      PIC_OBTAINER_MEDIA_ROOT: /var/lib/pic-obtainer/media
      PIC_OBTAINER_IMPORT_ROOT: /var/lib/pic-obtainer/imports
      PIC_OBTAINER_ROOT_PATH: /m/pic_obtainer
      PIC_OBTAINER_AYAYA_ADAPTER_SECRET: ${PIC_OBTAINER_AYAYA_ADAPTER_SECRET:?Set PIC_OBTAINER_AYAYA_ADAPTER_SECRET in .env}
    depends_on:
      pic_obtainer_migrate:
        condition: service_completed_successfully
    volumes:
      - ${PIC_OBTAINER_MEDIA_HOST_PATH:?Set PIC_OBTAINER_MEDIA_HOST_PATH in .env}:/var/lib/pic-obtainer/media
      - ${PIC_OBTAINER_IMPORT_HOST_PATH:?Set PIC_OBTAINER_IMPORT_HOST_PATH in .env}:/var/lib/pic-obtainer/imports:ro

  pic_obtainer_worker:
    image: ${PIC_OBTAINER_IMAGE:?Set PIC_OBTAINER_IMAGE in .env}
    command: ["pic-obtainer-worker"]
    environment:
      PIC_OBTAINER_DATABASE_URL: postgresql+psycopg://pic_obtainer:${PIC_OBTAINER_POSTGRES_PASSWORD:?Set PIC_OBTAINER_POSTGRES_PASSWORD in .env}@pic_obtainer_postgres:5432/ayaya_mod_pic_obtainer
      PIC_OBTAINER_MEDIA_ROOT: /var/lib/pic-obtainer/media
      PIC_OBTAINER_IMPORT_ROOT: /var/lib/pic-obtainer/imports
      PIC_OBTAINER_RULE34_API_BASE_URL: ${PIC_OBTAINER_RULE34_API_BASE_URL:-https://api.rule34.xxx/index.php}
      PIC_OBTAINER_RULE34_USER_ID: ${PIC_OBTAINER_RULE34_USER_ID:?Set PIC_OBTAINER_RULE34_USER_ID in .env}
      PIC_OBTAINER_RULE34_API_KEY: ${PIC_OBTAINER_RULE34_API_KEY:?Set PIC_OBTAINER_RULE34_API_KEY in .env}
    depends_on:
      pic_obtainer_migrate:
        condition: service_completed_successfully
    volumes:
      - ${PIC_OBTAINER_MEDIA_HOST_PATH:?Set PIC_OBTAINER_MEDIA_HOST_PATH in .env}:/var/lib/pic-obtainer/media
      - ${PIC_OBTAINER_IMPORT_HOST_PATH:?Set PIC_OBTAINER_IMPORT_HOST_PATH in .env}:/var/lib/pic-obtainer/imports:ro

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      core:
        condition: service_healthy
    ports:
      - "${NGINX_HOST_PORT:?Set NGINX_HOST_PORT in .env}:80"
    volumes:
      - ./deploy/nginx/ayaya.example.conf:/etc/nginx/nginx.conf:ro

volumes:
  postgres_data:
  pic_obtainer_postgres_data:
