events {}

http {
  resolver 127.0.0.11 ipv6=off valid=10s;

  server {
    listen 80;
    server_name ayaya.local localhost;

    set $core_upstream core;
    set $notes_app_upstream notes_app;
    set $planning_app_upstream planning_app;
    set $pic_obtainer_api_upstream pic_obtainer_api;
    set $telegram_app_upstream telegram_app;

    location / {
      proxy_pass http://$core_upstream:3000;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /internal/auth/module_access {
      internal;
      proxy_pass http://$core_upstream:3000/internal/auth/module_access;
      proxy_pass_request_body off;
      proxy_pass_request_headers off;
      proxy_set_header Content-Length "";
      proxy_set_header Host $http_host;
      proxy_set_header X-Original-URI $request_uri;
      proxy_set_header Cookie $http_cookie;
    }

    location /m/notes {
      auth_request /internal/auth/module_access;

      auth_request_set $ayaya_user_id $upstream_http_x_ayaya_user_id;
      auth_request_set $ayaya_user_email $upstream_http_x_ayaya_user_email;
      auth_request_set $ayaya_user_display_name $upstream_http_x_ayaya_user_display_name;
      auth_request_set $ayaya_user_role $upstream_http_x_ayaya_user_role;
      auth_request_set $ayaya_module_key $upstream_http_x_ayaya_module_key;
      auth_request_set $ayaya_request_id $upstream_http_x_ayaya_request_id;

      proxy_pass http://$notes_app_upstream:3000;
      # Rebuild the upstream request from an allowlist so client X-Ayaya-* values cannot pass through.
      proxy_pass_request_headers off;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Host $http_host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header Cookie $http_cookie;
      proxy_set_header Authorization $http_authorization;
      proxy_set_header Content-Type $http_content_type;
      proxy_set_header Content-Length $http_content_length;
      proxy_set_header Accept $http_accept;
      proxy_set_header Accept-Language $http_accept_language;
      proxy_set_header User-Agent $http_user_agent;
      proxy_set_header Origin $http_origin;
      proxy_set_header Referer $http_referer;
      proxy_set_header X-CSRF-Token $http_x_csrf_token;
      proxy_set_header X-Request-Id $http_x_request_id;
      proxy_set_header X-Ayaya-User-Id $ayaya_user_id;
      proxy_set_header X-Ayaya-User-Email $ayaya_user_email;
      proxy_set_header X-Ayaya-User-Display-Name $ayaya_user_display_name;
      proxy_set_header X-Ayaya-User-Role $ayaya_user_role;
      proxy_set_header X-Ayaya-Module-Key $ayaya_module_key;
      proxy_set_header X-Ayaya-Request-Id $ayaya_request_id;
    }

    location /m/planning {
      auth_request /internal/auth/module_access;

      auth_request_set $ayaya_user_id $upstream_http_x_ayaya_user_id;
      auth_request_set $ayaya_user_email $upstream_http_x_ayaya_user_email;
      auth_request_set $ayaya_user_display_name $upstream_http_x_ayaya_user_display_name;
      auth_request_set $ayaya_user_role $upstream_http_x_ayaya_user_role;
      auth_request_set $ayaya_module_key $upstream_http_x_ayaya_module_key;
      auth_request_set $ayaya_request_id $upstream_http_x_ayaya_request_id;

      proxy_pass http://$planning_app_upstream:3000;
      # Rebuild the upstream request from an allowlist so client X-Ayaya-* values cannot pass through.
      proxy_pass_request_headers off;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Host $http_host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header Cookie $http_cookie;
      proxy_set_header Authorization $http_authorization;
      proxy_set_header Content-Type $http_content_type;
      proxy_set_header Content-Length $http_content_length;
      proxy_set_header Accept $http_accept;
      proxy_set_header Accept-Language $http_accept_language;
      proxy_set_header User-Agent $http_user_agent;
      proxy_set_header Origin $http_origin;
      proxy_set_header Referer $http_referer;
      proxy_set_header X-CSRF-Token $http_x_csrf_token;
      proxy_set_header X-Request-Id $http_x_request_id;
      proxy_set_header X-Ayaya-User-Id $ayaya_user_id;
      proxy_set_header X-Ayaya-User-Email $ayaya_user_email;
      proxy_set_header X-Ayaya-User-Display-Name $ayaya_user_display_name;
      proxy_set_header X-Ayaya-User-Role $ayaya_user_role;
      proxy_set_header X-Ayaya-Module-Key $ayaya_module_key;
      proxy_set_header X-Ayaya-Request-Id $ayaya_request_id;
    }

    location = /m/telegram {
      return 308 /m/telegram/;
    }

    location /m/telegram/ {
      auth_request /internal/auth/module_access;

      auth_request_set $ayaya_user_id $upstream_http_x_ayaya_user_id;
      auth_request_set $ayaya_user_email $upstream_http_x_ayaya_user_email;
      auth_request_set $ayaya_user_display_name $upstream_http_x_ayaya_user_display_name;
      auth_request_set $ayaya_user_role $upstream_http_x_ayaya_user_role;
      auth_request_set $ayaya_module_key $upstream_http_x_ayaya_module_key;
      auth_request_set $ayaya_request_id $upstream_http_x_ayaya_request_id;
      auth_request_set $ayaya_identity_signature $upstream_http_x_ayaya_identity_signature;

      proxy_pass http://$telegram_app_upstream:3000;
      # Rebuild the upstream request from an allowlist so client X-Ayaya-* values cannot pass through.
      proxy_pass_request_headers off;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Host $http_host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header Cookie $http_cookie;
      proxy_set_header Authorization $http_authorization;
      proxy_set_header Content-Type $http_content_type;
      proxy_set_header Content-Length $http_content_length;
      proxy_set_header Accept $http_accept;
      proxy_set_header Accept-Language $http_accept_language;
      proxy_set_header User-Agent $http_user_agent;
      proxy_set_header Origin $http_origin;
      proxy_set_header Referer $http_referer;
      proxy_set_header Sec-Fetch-Dest $http_sec_fetch_dest;
      proxy_set_header Sec-Fetch-Mode $http_sec_fetch_mode;
      proxy_set_header Sec-Fetch-Site $http_sec_fetch_site;
      proxy_set_header Sec-Fetch-User $http_sec_fetch_user;
      proxy_set_header X-CSRF-Token $http_x_csrf_token;
      proxy_set_header X-Request-Id $http_x_request_id;
      proxy_set_header X-Ayaya-User-Id $ayaya_user_id;
      proxy_set_header X-Ayaya-User-Email $ayaya_user_email;
      proxy_set_header X-Ayaya-User-Display-Name $ayaya_user_display_name;
      proxy_set_header X-Ayaya-User-Role $ayaya_user_role;
      proxy_set_header X-Ayaya-Module-Key $ayaya_module_key;
      proxy_set_header X-Ayaya-Request-Id $ayaya_request_id;
      proxy_set_header X-Ayaya-Identity-Signature $ayaya_identity_signature;
    }

    location = /m/pic_obtainer {
      return 308 /m/pic_obtainer/;
    }

    location /m/pic_obtainer/ {
      auth_request /internal/auth/module_access;

      auth_request_set $ayaya_user_id $upstream_http_x_ayaya_user_id;
      auth_request_set $ayaya_user_email $upstream_http_x_ayaya_user_email;
      auth_request_set $ayaya_user_display_name $upstream_http_x_ayaya_user_display_name;
      auth_request_set $ayaya_user_role $upstream_http_x_ayaya_user_role;
      auth_request_set $ayaya_module_key $upstream_http_x_ayaya_module_key;
      auth_request_set $ayaya_request_id $upstream_http_x_ayaya_request_id;

      proxy_pass http://$pic_obtainer_api_upstream:8000/;
      proxy_pass_request_headers off;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-Host $http_host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header X-Forwarded-Prefix /m/pic_obtainer;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header Cookie $http_cookie;
      proxy_set_header Content-Type $http_content_type;
      proxy_set_header Content-Length $http_content_length;
      proxy_set_header Accept $http_accept;
      proxy_set_header Accept-Language $http_accept_language;
      proxy_set_header User-Agent $http_user_agent;
      proxy_set_header Origin $http_origin;
      proxy_set_header Referer $http_referer;
      proxy_set_header X-CSRF-Token $http_x_csrf_token;
      proxy_set_header X-Request-Id $http_x_request_id;
      proxy_set_header X-Ayaya-User-Id $ayaya_user_id;
      proxy_set_header X-Ayaya-User-Email $ayaya_user_email;
      proxy_set_header X-Ayaya-User-Display-Name $ayaya_user_display_name;
      proxy_set_header X-Ayaya-User-Role $ayaya_user_role;
      proxy_set_header X-Ayaya-Module-Key $ayaya_module_key;
      proxy_set_header X-Ayaya-Request-Id $ayaya_request_id;
    }
  }
}
