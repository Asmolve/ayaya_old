services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ayaya_mod_pic_obtainer
      POSTGRES_USER: pic_obtainer
      POSTGRES_PASSWORD: pic_obtainer
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pic_obtainer -d ayaya_mod_pic_obtainer"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data

  migrate:
    image: ${PIC_OBTAINER_IMAGE:?Set PIC_OBTAINER_IMAGE to the Pic Obtainer image}
    command: ["alembic", "-x", "db_url=${PIC_OBTAINER_DATABASE_URL:-postgresql+psycopg://pic_obtainer:pic_obtainer@postgres:5432/ayaya_mod_pic_obtainer}", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy

  pic_obtainer_api:
    image: ${PIC_OBTAINER_IMAGE:?Set PIC_OBTAINER_IMAGE to the Pic Obtainer image}
    command: ["uvicorn", "pic_obtainer.api.main:create_app", "--factory", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      PIC_OBTAINER_DATABASE_URL: ${PIC_OBTAINER_DATABASE_URL:-postgresql+psycopg://pic_obtainer:pic_obtainer@postgres:5432/ayaya_mod_pic_obtainer}
      PIC_OBTAINER_MEDIA_ROOT: ${PIC_OBTAINER_MEDIA_ROOT:?Set PIC_OBTAINER_MEDIA_ROOT}
      PIC_OBTAINER_AYAYA_ADAPTER_SECRET: ${PIC_OBTAINER_AYAYA_ADAPTER_SECRET:?Set Pic Obtainer adapter secret}
      PIC_OBTAINER_IMPORT_ROOT: ${PIC_OBTAINER_IMPORT_ROOT:?Set PIC_OBTAINER_IMPORT_ROOT}
    volumes:
      - ${PIC_OBTAINER_MEDIA_HOST_PATH:?Set PIC_OBTAINER_MEDIA_HOST_PATH}:${PIC_OBTAINER_MEDIA_ROOT:?Set PIC_OBTAINER_MEDIA_ROOT}
      - ${PIC_OBTAINER_IMPORT_HOST_PATH:?Set PIC_OBTAINER_IMPORT_HOST_PATH}:${PIC_OBTAINER_IMPORT_ROOT:?Set PIC_OBTAINER_IMPORT_ROOT}:ro
    depends_on:
      migrate:
        condition: service_completed_successfully

  pic_obtainer_worker:
    image: ${PIC_OBTAINER_IMAGE:?Set PIC_OBTAINER_IMAGE to the Pic Obtainer image}
    command: ["pic-obtainer-worker"]
    environment:
      PIC_OBTAINER_DATABASE_URL: ${PIC_OBTAINER_DATABASE_URL:-postgresql+psycopg://pic_obtainer:pic_obtainer@postgres:5432/ayaya_mod_pic_obtainer}
      PIC_OBTAINER_MEDIA_ROOT: ${PIC_OBTAINER_MEDIA_ROOT:?Set PIC_OBTAINER_MEDIA_ROOT}
      PIC_OBTAINER_RULE34_API_BASE_URL: ${PIC_OBTAINER_RULE34_API_BASE_URL:-https://api.rule34.xxx/index.php}
      PIC_OBTAINER_RULE34_USER_ID: ${PIC_OBTAINER_RULE34_USER_ID:?Set Rule34 user ID}
      PIC_OBTAINER_RULE34_API_KEY: ${PIC_OBTAINER_RULE34_API_KEY:?Set Rule34 API key}
      PIC_OBTAINER_IMPORT_ROOT: ${PIC_OBTAINER_IMPORT_ROOT:?Set PIC_OBTAINER_IMPORT_ROOT}
      PIC_OBTAINER_RULE34_REQUEST_LIMIT: ${PIC_OBTAINER_RULE34_REQUEST_LIMIT:-60}
      PIC_OBTAINER_RULE34_REQUEST_WINDOW_SECONDS: ${PIC_OBTAINER_RULE34_REQUEST_WINDOW_SECONDS:-60}
    volumes:
      - ${PIC_OBTAINER_MEDIA_HOST_PATH:?Set PIC_OBTAINER_MEDIA_HOST_PATH}:${PIC_OBTAINER_MEDIA_ROOT:?Set PIC_OBTAINER_MEDIA_ROOT}
      - ${PIC_OBTAINER_IMPORT_HOST_PATH:?Set PIC_OBTAINER_IMPORT_HOST_PATH}:${PIC_OBTAINER_IMPORT_ROOT:?Set PIC_OBTAINER_IMPORT_ROOT}:ro
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  postgres-data:
